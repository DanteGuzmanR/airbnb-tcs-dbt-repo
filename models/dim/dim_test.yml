version: 2

models:
  # NOTE: the `dim_listings_cleansed` tests (unique / not_null /
  # accepted_values / relationships) now live in
  # models/assessment/schema.yml. A model may only be described in ONE
  # schema file, so they were moved there rather than duplicated.

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
         compare_model: source ('airbnb','listings')

    columns:
      - name: price
        tests:  
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: .99
              min_value: 50
              max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              max_value: 5000
              config:
                severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number
