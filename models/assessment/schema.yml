version: 2

models:
  - name: dim_listings_cleansed
    columns:

      # NOTE: the assessment brief calls this column `listing_id`, but the
      # column that actually exists in this project is `listings_id`
      # (see models/src/src_listings.sql). Tests must use the real name.
      - name: listings_id
        tests:
          - unique
          - not_null

      - name: room_type
        tests:
          - accepted_values:
              values: ['Entire home/apt',
                       'Private room',
                       'Shared room',
                       'Hotel room']

      - name: host_id
        tests:
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id
